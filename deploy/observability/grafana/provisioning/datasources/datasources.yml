apiVersion: 1
datasources:
  - name: Prometheus
    uid: flowforge-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
  - name: Jaeger
    uid: flowforge-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
