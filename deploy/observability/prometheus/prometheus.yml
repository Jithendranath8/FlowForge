# Local observability stack (docker compose --profile observability). Scrapes the
# FlowForge API's metrics listener on the host (Docker Desktop reaches 127.0.0.1;
# on Linux bind METRICS_HOST to the docker bridge address).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/flowforge.yml

scrape_configs:
  - job_name: flowforge-api
    static_configs:
      - targets: ["host.docker.internal:9464"]
